[project]
name = "adb-export-tabs"
version = "0.0.1"
description = "Export open tabs from a Chromium-based Android browser as Markdown or JSON."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "adbutils>=2.12.0",
]

[project.urls]
Repository = "https://github.com/hexadecimal233/py-scripts"

[project.scripts]
adb-export-tabs = "adb_export_tabs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
